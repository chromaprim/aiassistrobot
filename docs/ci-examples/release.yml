name: Release QQ packages
on:
  push:
    tags: ['qq-v*']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/build_release.py
      - if: runner.os == 'Linux'
        run: |
          bash -n setup.sh first-run.sh install-docker.sh
          docker compose config --quiet
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "qq-v$(cat VERSION)"
      - run: python scripts/build_release.py
      - name: Publish installer archives and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "QQ stage one $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
